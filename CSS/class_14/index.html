<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Media Queries</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Responsive Website</h1>
    <p>
      Media queries are used to apply different CSS styles depending on the
      screen size or device conditions.
    </p>

    <div class="container">
      <div class="card">
        <h2>Card 1</h2>
        <p>This is card one.</p>
      </div>

      <div class="card">
        <h2>Card 2</h2>
        <p>This is card two.</p>
      </div>

      <div class="card">
        <h2>Card 3</h2>
        <p>This is card three.</p>
      </div>
    </div>
  </body>
</html>
