<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Transition Example</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>CSS Transition Example</h1>
    <p>
      transition makes a CSS property change happen smoothly instead of changing
      instantly.
    </p>
    <p>
      It is commonly triggered by a user interaction/state change, such as
      :hover, :focus,
    </p>
    <div class="card">
      <h2>Hover Me</h2>

      <p>Move your mouse over this card to see the transition effect.</p>

      <button>Learn More</button>
    </div>
  </body>
