<!-- What is HTML?=> HTML stands for Hyper Text Markup Language | HTML describes the structure of a Web page -->

<!-- It defines that this document is an HTML5 document -->
<!doctype html>

<!--HTML element is the root element of an HTML page -->
<!-- The top-most (parent) element that contains all the other HTML elements. -->
<html lang="en">
  
<!-- element contains meta information about the HTML page -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- element specifies a title for the HTML page (which is shown in the browser's title bar or in the page's tab) -->
    <title>HTML</title>
  </head>


  <!-- The <body> element defines the document's body. -->
  <body>
    <!-- HTML Headings HTML headings are defined with the <h1> to <h6> tags. -->
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>

    <!-- HTML Paragraphs HTML paragraphs are defined with the <p> tag: -->
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>

    <!-- HTML Links -->
    <a href="https://www.w3schools.com">This is a link</a>

    <!-- HTML Images -->
    <img src="w3schools.jpg" alt="W3Schools.com" width="104" height="142" />


  </body>
</html>
