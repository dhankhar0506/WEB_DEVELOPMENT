<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>HTML BLOCK AND INLINE ELEMENTS</h1>
    <!-- Block Element -->
    <div>
      <h1>heading is BLOCK</h1>
      <p>p is BLOCK</p>
    </div>

    <div>
      <form>
        <input type="text" placeholder="this is block" />
      </form>
    </div>
    <ul>
      <li>List is BLOCK</li>
    </ul>
    <header>header is BLOCK</header>

    <hr />
    <hr />
    <br />
    <br />
    <!-- INLINE ELEMENT -->
    <span>This is inline span</span> <br>
    <a href="#">this is inline </a> <br>
    <strong> strong inline</strong> <br>
    <abbr title="abbrevation is an inline element">AIE</abbr> <br>
    <iframe src="https://google.com"></iframe> <br>

    <br>
    <!-- button -->
    <button type="submit" onclick="alert('on click is an Event')">
      this is clickable
    </button>

    <br>
    <!-- Iframe -->
    <iframe
      width="300"
      height="400"
      src="https://wikipedia.org"
      frameborder="0"
      allowfullscreen
      >check</iframe
    >
  </body>
</html>
