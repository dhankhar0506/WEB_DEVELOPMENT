<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>THIS IS TABLE AREA</h1>

    <table>
      <caption>
        This is Student Table
      </caption>

      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td rowspan="2">Gourav</td>
          <td>27</td>
          <td>Developer</td>
        </tr>

        <tr>
          <td>28</td>
          <td>Node.js</td>
        </tr>

        <tr>
          <td>Rahul</td>
          <td>25</td>
          <td>Java</td>
        </tr>

        <tr>
          <td>Aman</td>
          <td>26</td>
          <td>Python</td>
        </tr>

        <tr>
          <td colspan="2">Priya</td>
          <td>React</td>
        </tr>

        <tr>
          <td>Neha</td>
          <td>28</td>
          <td>Node.js</td>
        </tr>
      </tbody>
    </table>

    <!-- unOrdered list -->
    <ul style="list-style: square">
      <li>one</li>
      <li>two</li>
      <li>three</li>
    </ul>
    <!-- OrderedList -->

    <ol style="list-style: lower-roman">
      <li>order : 1</li>
      <li>order : 2</li>
      <li>order : 3</li>
    </ol>

    <!-- Description List -->
    <dl>
      <dt>Coffee</dt>
      <dd>Black hot drink</dd>

      <dt>Milk</dt>
      <dd>White cold drink</dd>
    </dl>
  </body>
</html>
