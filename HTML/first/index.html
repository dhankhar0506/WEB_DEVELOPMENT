<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width , initial-scale=1.0" />
    <title>My PortFolio</title>
  </head>
  <body>
    <!-- HEADING -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <!-- paragraph -->
    <p>
      This is an <br />
      paragraph <br />
      tag
    </p>

    <!--  <pre-->
    <pre>
this is 
        a pre 
                tag
      </pre
    >
    <!-- <strong -->
    <p><strong>Strong</strong>tag</p>

    <!-- <i> vs <em> -->
    <i> this is italic</i>
    <em> this is italic</em>

    <!-- <mark -->
    <p>this is <mark>mark tag</mark></p>

    <!-- small -->
    <small>THIS IS SMALL TEXT</small>

    <!-- <del> -->
    <del> this is del tag</del>

    <!-- <ins> -->
    <ins>this is inserted tag</ins>

    <!-- sub -->
    <p>CO<sub>2</sub></p>

    <!-- sup -->
    <p>x<sup>2</sup></p>

    <!-- <abbr> -->
    <p><abbr title="hyper text markup languge">HTML</abbr></p>
  </body>
</html>
